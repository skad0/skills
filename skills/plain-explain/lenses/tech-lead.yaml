id: tech-lead
name: Tech lead
extends: base
allowed_terms:
  - dependency
  - load
  - failure
  - limit
  - tradeoff
  - fallback
max_boxes: 5
min_boxes: 3
max_steps: 6
max_level: 2
collapse: true
show_internals: true
show_details: false
show_steps: false
show_glossary: false
show_skipped: false
direction: TB
max_prose_words: 50
max_sentences_per_step: 1
max_arrow_words: 5
max_words_per_step: 20
max_sentence_words: 20
max_closing_items: 3
closing_section:
  name: Tradeoffs and failure points
  field: tradeoffs
  contains: At most three short bullets on cost, scale, dependencies, and failure.
tone: >
  Coarse boxes named for real parts, such as the user's phone, the report
  server, and the files. Failures stay on dashed arrows. No step list.
